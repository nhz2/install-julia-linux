name: Install test

# Smoke test: run the nightly install script non-interactively (-y) on Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  default-install:
    name: default install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run install script with nightly version
        run: sh src/install-julia.sh nightly -y

      # The script links into $HOME/.local/bin, which isn't on PATH by default on
      # the runner. Add it for subsequent steps so `julia` resolves.
      - name: Add symlink dir to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check julia runs
        run: |
          julia --version
          julia -e 'using InteractiveUtils; versioninfo()'
