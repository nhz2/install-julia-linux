name: Install test

# Smoke test: run the install script non-interactively (-y) on
# x86_64 and aarch64 Linux runners and on real macOS (Apple Silicon and Intel),
# then confirm the installed `julia` actually runs. This does not run
# test/runtests.jl - it only exercises a plain install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  default-install:
    name: default install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - name: Run install script with defaults
        run: sh src/install-julia.sh -y

      # The script links into $HOME/.local/bin, which isn't on PATH by default on
      # the runner. Add it for subsequent steps so `julia` resolves.
      - name: Add symlink dir to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check julia runs
        run: |
          julia --version
          julia -e 'using InteractiveUtils; versioninfo()'
  versions-install:
    name: install (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'nightly'
          - '1'
          - '1.10'

    steps:
      - uses: actions/checkout@v7

      - name: Run install script
        run: sh src/install-julia.sh ${{ matrix.version }} -y

      # The script links into $HOME/.local/bin, which isn't on PATH by default on
      # the runner. Add it for subsequent steps so `julia` resolves.
      - name: Add symlink dir to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check julia runs
        run: |
          julia --version
          julia -e 'using InteractiveUtils; versioninfo()'
